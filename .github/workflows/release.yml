name: Publish GitHub Release

# Records merged source. Production deployment runs independently on infra changes.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.created && !github.event.deleted && !github.event.forced }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish the merged PR
        uses: actions/github-script@v8
        with:
          script: |
            const repo = context.repo;
            const sha = context.sha;
            const pulls = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              ...repo, commit_sha: sha, per_page: 100
            });
            const pr = pulls.find(p => p.merged_at && p.base.ref === "main" &&
              p.base.repo.full_name === process.env.GITHUB_REPOSITORY && p.merge_commit_sha === sha);
            if (!pr) {
              core.info("No PR merged into main at this SHA.");
              return;
            }

            const tag = `release-pr-${pr.number}`;
            async function optional(request) {
              try {
                return (await request).data;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            const ref = await optional(github.rest.git.getRef({...repo, ref: `tags/${tag}`}));
            if (ref && (ref.object.type !== "commit" || ref.object.sha !== sha)) {
              throw new Error(`Tag ${tag} already exists with a different target.`);
            }
            const release = await optional(github.rest.repos.getReleaseByTag({...repo, tag}));
            if (release) {
              if (!ref || release.draft) throw new Error(`Check the existing release for ${tag}.`);
              core.info(`Already published: ${release.html_url}`);
              return;
            }

            const notes = [`- ${pr.title} (#${pr.number})`];
            notes.push("", "### Submodules");
            for (const path of ["emonotate-app", "emonotate-backend"]) {
              const {data: entry} = await github.rest.repos.getContent({...repo, path, ref: sha});
              if (!entry.submodule_git_url || !entry.sha || !entry.html_url) throw new Error(`Expected a GitHub submodule at ${path}.`);
              notes.push(`- ${path}: [\`${entry.sha}\`](${entry.html_url})`);
            }
            await github.rest.repos.createRelease({
              ...repo, tag_name: tag, target_commitish: sha, name: tag, body: notes.join("\n")
            });
