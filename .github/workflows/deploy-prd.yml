name: Deploy infrastructure to prd

# Runs only when a push to main changes Terraform. The frontend and backend
# repositories deploy the apps themselves.
run-name: Terraform apply ${{ github.sha }} to prd

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
      - ".github/workflows/deploy-prd.yml"

permissions:
  id-token: write
  contents: read

# Never run two applies to the same environment at once; queue them instead.
concurrency:
  group: terraform-prd
  cancel-in-progress: false

jobs:
  apply:
    uses: ./.github/workflows/terraform.yml
    with:
      environment: prd
      command: apply
    secrets:
      aws_role_arn: ${{ secrets.AWS_TF_APPLY_ROLE_ARN_PRD }}
