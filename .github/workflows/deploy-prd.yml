name: Deploy to prd

run-name: Deploy ${{ github.sha }} to prd

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

# Never run two deploys to the same environment at once; queue them instead.
concurrency:
  group: deploy-prd
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prd
    secrets:
      aws_role_arn: ${{ secrets.AWS_CI_ROLE_ARN_PRD }}
      api_endpoint: ${{ secrets.PRD_API_ENDPOINT }}
