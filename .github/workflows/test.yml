name: Test

# Runs on PRs to develop/main and is reused by the deploy workflows,
# so a failing test blocks both merging (with branch protection) and deploying.
on:
  pull_request:
    branches:
      - develop
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: React test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Show submodule commits
        run: git submodule status

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: emonotate-app/package-lock.json

      - name: Install dependencies
        working-directory: emonotate-app
        run: npm ci

      - name: Test
        working-directory: emonotate-app
        env:
          CI: "true"
        run: npm test -- --watchAll=false

      - name: Build
        working-directory: emonotate-app
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          CI: "false"
        run: npm run build

  backend:
    name: Django test
    # Python 3.9 is not provided for newer Ubuntu images used by ubuntu-latest.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: emonotate
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: emonotate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emonotate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: backend.settings.aws
      DJANGO_SECRET_KEY: ci-only-secret
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: emonotate
      DB_USER: emonotate
      DB_PASSWORD: postgres
      AWS_STORAGE_BUCKET_NAME: ci-dummy-bucket
      AWS_REGION: ap-northeast-1
      RANDOM_USERNAME_NUM: "8"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Show submodule commits
        run: git submodule status

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: emonotate-backend/requirements-aws.txt

      - name: Install dependencies
        working-directory: emonotate-backend
        run: |
          python -m pip install --upgrade pip
          # djangorestframework-simplejwt 5.2 imports pkg_resources.
          python -m pip install "setuptools<70"
          python -m pip install -r requirements-aws.txt

      - name: Test
        working-directory: emonotate-backend
        run: python manage.py test --noinput
