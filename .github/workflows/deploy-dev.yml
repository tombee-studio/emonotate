name: Deploy to dev

on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

jobs:
  deploy-backend:
    name: Build and deploy backend (dev)
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-1
      ENV: dev
      PROJECT: emonotate
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          REPO="${REGISTRY}/${PROJECT}-${ENV}-backend"
          docker build \
            -f emonotate-backend/Dockerfile.aws \
            -t "${REPO}:${IMAGE_TAG}" \
            -t "${REPO}:latest" \
            emonotate-backend/
          docker push "${REPO}:${IMAGE_TAG}"
          docker push "${REPO}:latest"
          echo "IMAGE_URI=${REPO}:${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name "${PROJECT}-${ENV}-backend" \
            --image-uri "$IMAGE_URI" \
            --region "$AWS_REGION"

  deploy-frontend:
    name: Build and deploy frontend (dev)
    runs-on: ubuntu-latest
    needs: deploy-backend
    env:
      AWS_REGION: ap-northeast-1
      ENV: dev
      PROJECT: emonotate
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: emonotate-app/package-lock.json

      - name: Install dependencies
        working-directory: emonotate-app
        run: npm ci

      - name: Build
        working-directory: emonotate-app
        env:
          REACT_APP_API_URL: ${{ secrets.DEV_API_ENDPOINT }}
          REACT_APP_ENV: dev
        run: npm run build

      - name: Deploy to S3
        run: |
          BUCKET="${PROJECT}-${ENV}-frontend"
          aws s3 sync emonotate-app/build/ "s3://${BUCKET}" \
            --delete \
            --cache-control "public, max-age=31536000" \
            --exclude "index.html"
          aws s3 cp emonotate-app/build/index.html "s3://${BUCKET}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          CF_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='${PROJECT}-${ENV}-frontend-cf'].Id" \
            --output text)
          if [[ -n "$CF_ID" && "$CF_ID" != "None" ]]; then
            aws cloudfront create-invalidation \
              --distribution-id "$CF_ID" \
              --paths "/*"
          fi
